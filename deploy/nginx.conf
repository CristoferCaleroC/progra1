log_format lb '$remote_addr -> $upstream_addr [$status] $request';

upstream progra1_backend {
    server app:8081 max_fails=3 fail_timeout=15s;
    server 172.31.22.239:8081 max_fails=3 fail_timeout=15s;
    server 172.31.25.229:8081 max_fails=3 fail_timeout=15s;
    server 172.31.27.66:8081 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log lb;

    location / {
        proxy_pass http://progra1_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        add_header X-Served-By $upstream_addr always;
    }
}