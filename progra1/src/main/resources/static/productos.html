<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - CRUD</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="/css/productos.css">
</head>
<body>

    <div class="header">
        <h1>Gestión de Productos</h1>
        <a href="rickandmorty.html" class="btn-volver">Ir a Rick & Morty →</a>
    </div>

    <div class="container">
        <!-- Barra superior con buscador, indicador de cuenta regresiva y botón Nuevo -->
        <div class="controls-bar" style="flex-direction: column; align-items: stretch;">
            <div style="display: flex; gap: 15px;">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por Nombre o ID (ej: Teclado o 2)..." oninput="manejarBusquedaConDelay()">
                <button class="btn-nuevo" onclick="abrirModalNuevo()">+ Nuevo</button>
            </div>
            <!-- Indicador de la cuenta regresiva de 4 segundos -->
            <div id="countdownIndicator" style="margin-top: 8px; font-size: 14px; color: #2e86de; font-weight: bold; min-height: 20px;"></div>
        </div>

        <div class="grid-container" id="productsGrid">
            <!-- Tarjetas dinámicas -->
        </div>
    </div>

    <!-- Modal de Detalle con Botones Editar y Borrar -->
    <div class="modal-overlay" id="productModal" onclick="cerrarModalExterno(event, 'productModal')">
        <div class="modal-content">
            <button class="modal-header-close" onclick="cerrarModal('productModal')">&times;</button>
            <div class="modal-body" id="modalBody">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Modal de Formulario (Crear / Editar) -->
    <div class="modal-overlay" id="formModal" onclick="cerrarModalExterno(event, 'formModal')">
        <div class="modal-content">
            <button class="modal-header-close" onclick="cerrarModal('formModal')">&times;</button>
            <div class="modal-body">
                <h2 id="formModalTitle" style="margin-bottom: 15px; color: #2c3e50;">Nuevo Producto</h2>
                <form id="productForm" onsubmit="guardarProductoForm(event)">
                    <input type="hidden" id="prodId">
                    <div class="form-group">
                        <label>Nombre:</label>
                        <input type="text" id="prodNombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Precio ($):</label>
                        <input type="number" step="0.01" id="prodPrecio" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción:</label>
                        <textarea id="prodDescripcion" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>URL de la Imagen:</label>
                        <input type="text" id="prodImagen" class="form-control">
                    </div>
                    <button type="submit" class="btn-guardar">Guardar Producto</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="/js/productos.js"></script>
</body>
</html>
