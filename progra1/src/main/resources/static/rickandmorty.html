<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty - API Explorer</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="/css/rickandmorty.css">
</head>
<body>

    <div class="header">
        <h1>Universo Rick & Morty</h1>
        <a href="productos.html" class="btn-volver">← Volver a Productos</a>
    </div>

    <div class="container">
        <!-- Pestañas para cambiar entre Personajes, Lugares y Episodios -->
        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarSeccion('personajes')">1. Personajes</button>
            <button class="tab-btn" onclick="cambiarSeccion('lugares')">2. Lugares</button>
            <button class="tab-btn" onclick="cambiarSeccion('episodios')">3. Episodios</button>
        </div>

        <!-- Barra de Búsqueda y Cuenta Regresiva (Limlia de estilos en línea oscuros) -->
        <div class="controls-bar" style="margin-bottom: 20px;">
            <input type="text" id="searchInput" class="search-input" placeholder="Escribe para buscar (Nombre o ID)..." oninput="manejarBusquedaConDelay()">
            <div id="countdownIndicator" style="margin-top: 8px; font-size: 14px; color: #3182ce; font-weight: bold; min-height: 20px;"></div>
        </div>

        <!-- Contenedor dinámico de tarjetas -->
        <div class="grid-container" id="rmGrid">
            <!-- Datos cargados por JavaScript -->
        </div>

        <!-- Controles de Paginación -->
        <div class="pagination" id="paginationControls">
            <button class="page-btn" onclick="cambiarPagina(-1)">Anterior</button>
            <span id="pageIndicator">Página 1</span>
            <button class="page-btn" onclick="cambiarPagina(1)">Siguiente</button>
        </div>
    </div>

    <!-- Modal de Detalle (Popup) -->
    <div class="modal-overlay" id="rmModal" onclick="cerrarModalExterno(event)">
        <div class="modal-content">
            <button class="modal-header-back" onclick="cerrarModal()">— BACK (Cerrar)</button>
            <div class="modal-body" id="modalBodyContent">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="/js/rickandmorty.js"></script>
</body>
</html>
