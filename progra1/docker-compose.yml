services:
  db:
    image: postgres:16
    container_name: progra1-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: progra1_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d progra1_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${DOCKERHUB_USER}/progra1:latest
    container_name: progra1-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/progra1_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      GATEWAY_KEY: ${GATEWAY_KEY}
    ports:
      - "8081:8081"

volumes:
  pgdata:
  